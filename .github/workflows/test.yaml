name: Test

on:
  push:
    branches: [NetTank,legacy,retro]
  pull_request:
    branches: [NetTank,legacy,retro]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run tests
        run: go test -race ./... -count=1
      - name: Run govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: Build server
        run: go build -o tank-server ./cmd/server
      - name: Build bot
        run: go build -o tank-bot ./cmd/bot-go
