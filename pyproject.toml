[project]
name = "tank-game"
version = "0.9.6"
description = "Python 3 / PyGame recreation of the classic two-player TANK! game from Cursor Magazine #26."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "TANK Port", email = "noreply@example.com" },
]
dependencies = [
  "pygame>=2.5.0",
  "py_trees>=2.2.0",
  "cbmcodecs2>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "vulture>=2.11",
  "hypothesis>=6.0.0",
  "viztracer>=0.16.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tank_game*"]

[tool.setuptools.package-data]
"tank_game" = ["assets/fonts/*.ttf", "assets/fonts/FreeLicense.txt"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["tank_game", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
# Many debug strings / signatures exceed 100 cols; tighten in a follow-up pass
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# main.py runs `import py_trees` check before other imports (dependency bootstrap).
"tank_game/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
packages = ["tank_game"]
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

