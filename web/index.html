<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANK! NETWORK BATTLE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="error-banner" class="error-text hidden"></div>

    <main class="terminal">
        <header class="terminal-header">
            <div class="lobby-title">T A N K !</div>
            <div class="lobby-subtitle">NETWORK BATTLE</div>
        </header>

        <!-- SCREEN: LOBBY -->
        <section id="screen-lobby" class="screen">
            <div class="input-group">
                <label class="input-label" for="player-name">YOUR NAME:</label>
                <input type="text" id="player-name" class="input-field" placeholder="PLAYER" autocomplete="off">
            </div>

            <div class="input-group">
                <label class="input-label">DIFFICULTY: <span id="difficulty-value">5</span></label>
                <input type="range" id="difficulty" class="difficulty-slider" min="1" max="10" value="5">
            </div>

            <div class="btn-container">
                <button id="btn-create" class="btn btn-primary">CREATE ROOM</button>
            </div>

            <div class="divider">-- OR --</div>

            <div class="input-group">
                <label class="input-label">JOIN ROOM:</label>
                <div class="join-row">
                    <input type="text" id="join-code" class="input-field" maxlength="4" placeholder="CODE" autocomplete="off">
                    <button id="btn-join" class="btn btn-secondary">JOIN</button>
                </div>
            </div>
        </section>

        <!-- SCREEN: WAITING -->
        <section id="screen-waiting" class="screen hidden">
            <div class="room-code-container">
                <div class="input-label">ROOM CODE:</div>
                <div id="room-code-display" class="room-code-display">----</div>
                <button id="copy-btn" class="btn copy-btn">COPY</button>
            </div>

            <div id="difficulty-display" class="status-text">
                DIFFICULTY: 5
            </div>

            <div id="waiting-status" class="status-text">
                WAITING FOR OPPONENT...
            </div>

            <div class="btn-container">
                <button id="btn-cancel" class="btn btn-secondary">CANCEL</button>
            </div>
        </section>

        <!-- SCREEN: JOINING -->
        <section id="screen-join" class="screen hidden">
            <div class="status-text" style="text-align: center;">
                JOINING ROOM: <span id="join-display-code">----</span><br>
                CONNECTING... <span class="blink">_</span>
            </div>
        </section>
    </main>

    <footer class="footer-text">
        COMMODORE PET TERMINAL EMULATION V1.0
    </footer>

    <script src="app.js"></script>
</body>
</html>
